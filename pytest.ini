[pytest]
# Un solo comando valida todo el repositorio: python -m pytest -q
testpaths =
    tests
    controllers
    external/gesture_detection/tests
    external/mapeo3d/tests
python_files = test_*.py
addopts = --import-mode=importlib
norecursedirs = .venv .git results models thesis Tesis graphify-out cache cache_* __pycache__ external/crazyflie_firmware
filterwarnings =
    ignore::DeprecationWarning
